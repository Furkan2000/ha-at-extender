configuration:
  rufnummer:
    name: Phone number
  passwort:
    name: Password
  schwelle_gb:
    name: Threshold (GB)
  automatisch_nachbuchen:
    name: Auto top-up
  intervall_modus:
    name: Interval mode
  intervall_fest:
    name: Fixed interval (seconds)
  intervall_min:
    name: Random interval minimum (seconds)
  intervall_max:
    name: Random interval maximum (seconds)
  telegram_aktiv:
    name: Enable Telegram
  telegram_bot_token:
    name: Telegram bot token
  telegram_chat_id:
    name: Telegram chat ID
  telegram_jede_pruefung:
    name: Telegram after every check
    description: Send the remaining data after every check. Off = only on errors, low data or top-ups.
  log_level:
    name: Log level
